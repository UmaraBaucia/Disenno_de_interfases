<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lista de tareas</title>
  <link rel="stylesheet" href="tasks.css" />
</head>
<body>
  <main class="pagina-tareas">
    <section class="tarjeta-tareas">
      <h1>Lista de tareas</h1>

      <div class="formulario-tareas">
        <input id="entradaTarea" type="text" placeholder="Ingrese su tarea" />
        <button class="boton-agregar" id="botonAgregarTarea">Agregar tarea</button>
      </div>

      <ul id="listaTareas" class="lista-tareas"></ul>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
